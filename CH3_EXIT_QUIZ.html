<style>
body{font-family:system-ui,sans-serif;line-height:1.45;margin:0;padding:24px;background:radial-gradient(circle at top,#1b2745,#090a0f);color:#f2f2f2}
#quiz2{max-width:760px;margin:auto;background:#121212;border:1px solid #2c2c2c;border-radius:18px;padding:24px;box-shadow:0 0 25px rgba(0,0,0,.4)}
.quiz-header{text-align:center;margin-bottom:18px}.subtitle{color:#9fdcff}
.progress-wrap{width:100%;height:10px;background:#222;border-radius:20px;overflow:hidden;margin-bottom:18px}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ff99)}
#q2_stem{margin:.8rem 0 1rem;font-size:1.08rem;font-weight:500}
button{display:block;margin:6px 0;padding:12px;background:#181818;color:#f2f2f2;border:1px solid #333;border-radius:12px;cursor:pointer;text-align:left}
button:hover{border-color:#00d4ff}.correct{color:#00ff88}.incorrect{color:#ff6666}
</style>
<div id="quiz2"><div class="quiz-header"><h1>PH115 Exit Quiz</h1><div class="subtitle">Capacitors & RC Circuits</div></div><div class="progress-wrap"><div id="progress-bar"></div></div>
  <h3 id="q2_progress"></h3>
  <div id="q2_stem" style="margin:.5rem 0 1rem"></div>
  <div id="q2_options"></div>
  <div id="q2_feedback" style="margin-top:.75rem"></div>
  <button id="q2_restart" style="display:none;margin-top:1rem">Restart</button>
</div>

<script>
(() => {
  // Same engine, new dataset
  const QUESTIONS = [
    {
      original: "Think of a capacitor of some capacitance C. The capacitor holds charge Q1. The same capacitor is then charged to 2Q1. What is the new capacitance?",
      choices: ["C","C/2","2C","none of these"],
      correctIndex: 0
    },
    {
      original: "The current in a charging RC circuit in series will be _____ when the capacitor is fully charged:",
      choices: ["exactly zero","almost zero","maximum","almost maximum"],
      correctIndex: 1
    },
    {
      original: "Capacitance depends on:",
      choices: ["Geometry of the capacitor and dielectric","Geometry of the capacitor only","Dielectric only","the voltage connected"],
      correctIndex: 0
    },
    {
      original: "An empty capacitor is connected to a resistor and a DC source in series. When the switch closes and the charging starts, the potential across the resistor is: ",
      choices: ["zero","minimum","maximum","none of these apply"],
      correctIndex: 2
    },
    {
      original: "An empty capacitor is connected directly to the DC source in series without the presence of a resistor.  When the cap is fully charged, then the current in the circuit is: ",
      choices: ["zero","minimum","maximum","no such circuit exists"],
      correctIndex: 3
    },
    {
      original: "An empty capacitor is connected directly to the DC source in series with a resistor of resistance R. The energy lost to the resistor is always: ",
      choices: ["dependent on the resistor","dependent on the capacitor","zero","none of these apply"],
      correctIndex: 1
    },
    {
      original: "Two air-filled parallel plate capacitors in series that have the same charge area density and same plate\nseparation will always have the same: ",
      choices: ["Charge","Voltage","Capacitance","All of these"],
      correctIndex: 3
    },
    {
      original: "Two air-filled parallel plate capacitors in series that are being charged will always have the same:",
      choices: ["Energy","Potential","All of these","More info required"],
      correctIndex: 3
    },
    {
      original: "In a DC RC charging scenario, when the capacitor was just beginning to charge, the current in the circuit was:",
      choices: ["maximum","minimum but not zero","Zero"],
      correctIndex: 0
    },
    {
      original: "The speed of a capacitor discharging in a DC circuit depends on: ",
      choices: ["Resistance and capacitance","Capacitance only","Resistance only","None of these"],
      correctIndex: 0
    },
    {
      original: "The presence of a dielectric leads to:  ",
      choices: ["Increased capacitance","Decreased capacitance","Increased capacitor potential","Increased capacitor’s electric field","None of these"],
      correctIndex: 0
    },
    {
      original: "During a capacitor’s discharge through a resistor,",
      choices: ["Energy is lost, but not charge.","Charge is lost but not energy.","No energy nor charge is lost.","Both energy and charge are lost."],
      correctIndex: 0
    },
    {
      original: "A isolated capacitor C=1 F carries initially a charge Q=1 C and discharges to an identical capacitor which is also connected in series to a resistor R.  The steady-state charge is expected to split 0.5 C on each capacitor. What is the percentage of energy lost through the resistor? ",
      choices: ["0%","25%","50%","100%","None of these values"],
      correctIndex: 2
    },
    {
      original: "A capacitor is initially charged. The cap is then connected in series via a switch to another uncharged capacitor of the same capacitance and a resistor. The switch closes. Does the energy lost through the resistor depend on the resistor value?",
      choices: ["No","Yes","It depends if a ground is present"],
      correctIndex: 0
    },
    {
      original: "A capacitor with capacitance C is charged with charge Q. It is then connected to a resistor R. The charge lost through the resistor is: ",
      choices: ["Zero","Depends on the resistor","Depends on the initial charge on the capacitor","Depends on the initial charge on the capacitor and the resistor","None of these apply"],
      correctIndex: 0
    },
    {
      original: "Capacitor A has twice the plate area of capacitor B, but no information is given about the plate distance. When A is charged at 2 V, the charge is 2 C, and when B is charged at 3 V, the charge is 3 C. We can deduce that the two capacitances C_A and C_B are: ",
      choices: ["C_A=C_B","C_A>C_B","C_A<C_B","More information is required"],
      correctIndex: 0
    },
    {
      original: "When a capacitor is charging through a DC source, the net charge added in the circuit is: ",
      choices: ["dependent on the DC source","dependent on the resistor","dependent on the capacitor","zero"],
      correctIndex: 3
    },
    {
      original: "When a capacitor is discharging, the net charge change in the circuit will be: ",
      choices: ["become zero","remain zero","decay with time","none of these apply"],
      correctIndex: 1
    },
    {
      original: "We insert a dielectric to an isolated charged capacitor (no longer plugged into power). This leads to: ",
      choices: ["more stored charge","less stored charge","higher potential","lower potential"],
      correctIndex: 3
    },
    {
      original: "We insert a dielectric to a charged capacitor that is connected to a DC source. This leads to: ",
      choices: ["more stored charge","less stored charge","no difference in the stored charge"],
      correctIndex: 0
    },
    {
      original: "The current in an AC RC circuit in series will always be at _____ degrees phase difference with the resistor's potential",
      choices: ["0°","90°","180 °","depends on the resistor and the capacitor."],
      correctIndex: 0
    },
    {
      original: "The current in an AC RC circuit in series and the voltage across the entire circuit will always be at _____ degrees phase difference with the resistor. ",
      choices: ["0°","90°","180 °","depends on the resistor and the capacitor."],
      correctIndex: 3
    },
    {
      original: "The potential across the resistor and the capacitor in an AC circuit in series will always be at _____ degrees phase difference. ",
      choices: ["0°","90°","180 °","depends on the resistor and the capacitor."],
      correctIndex: 1
    },
    {
      original: "One of the major differences between DC and AC (sine-wave) that occurs when the circuit includes a capacitor is that ",
      choices: ["the capacitor has a type of 'resistance', but it is independent of frequency","the capacitance depends on frequency","the capacitor has a type of 'resistance', but it is dependent on frequency","none of these are on the list."],
      correctIndex: 3
    },
    {
      original: "As the AC source frequency increases in an RC in series, the maximum voltage across the resistor ",
      choices: ["approaches the maximum of the source","approaches zero","approaches the RMS of the capacitor","none of these on the list."],
      correctIndex: 0
    },
    {
      original: "Capacitors can be used as digital filters  ",
      choices: ["Only in AC.","Only in DC.","Both in AC and DC."],
      correctIndex: 0
    },
    {
      original: "An RC connected to an AC source at some given time has a potential across the capacitor of 0.5 V and a potential across the resistor (in series) of 0.7 V. This means that the voltage of the source at that same time is ",
      choices: ["0.86 V","1.2 V","Zero","None of these values"],
      correctIndex: 1
    },
    {
      original: "Reactive capacitance  is only a property of geometry and dielectric. This statement is ",
      choices: ["false","True","More information is required"],
      correctIndex: 0
    }
  ];

  const letters = "abcdefghijklmnopqrstuvwxyz".split("");

  function stemFrom(original){
    const i = original.indexOf("a)");
    return (i === -1) ? original : original.slice(0, i).replace(/[ ;:,.]+$/,"");
  }

  function runQuiz(){
    let index = 0, score = 0;
    const progress = document.getElementById("q2_progress");
    const stem = document.getElementById("q2_stem");
    const options = document.getElementById("q2_options");
    const feedback = document.getElementById("q2_feedback");
    const restartBtn = document.getElementById("q2_restart");
    restartBtn.style.display = "none";

    function render(){
      const total = QUESTIONS.length;
      const q = QUESTIONS[index];
      progress.textContent=`Question ${index+1} of ${total} · Score: ${score}/${total}`;document.getElementById("progress-bar").style.width=((index)/QUESTIONS.length*100)+"%";
      stem.textContent = stemFrom(q.original);
      options.innerHTML = "";
      feedback.textContent="";feedback.className="";
      q.choices.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.textContent = ` ${letters[i]}) ${text}`;
        btn.style.display = "block";
        btn.style.margin = ".25rem 0";
        btn.onclick = () => select(i);
        options.appendChild(btn);
      });
    }

    function select(i){
      const q = QUESTIONS[index];
      if(i !== q.correctIndex){
        // restart behavior
        progress.textContent = "";
        stem.textContent = "";
        options.innerHTML = "";
        feedback.className="incorrect";feedback.textContent="Incorrect — restarting from Question 1…";
        restartBtn.style.display = "inline-block";
        restartBtn.onclick = () => runQuiz();
        return;
      }
      score++;
      feedback.className="correct";feedback.textContent="Correct!";
      index++;
      if(index < QUESTIONS.length){
        setTimeout(render, 400);
      }else{
        setTimeout(() => {
          progress.textContent = "";
          stem.textContent = "";
          options.innerHTML = "";
          feedback.innerHTML = `✅ Perfect! You answered all questions correctly.<br>Score: ${score}/${QUESTIONS.length}`;
          try { localStorage.setItem("quiz2Score", JSON.stringify({score, total: QUESTIONS.length, ts: Date.now()})); } catch(e){}
          restartBtn.style.display = "inline-block";
          restartBtn.textContent = "Restart";
          restartBtn.onclick = () => runQuiz();
        }, 300);
      }
    }

    render();
  }

  runQuiz();
})();
</script>
